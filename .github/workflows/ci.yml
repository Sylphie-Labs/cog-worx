name: CI

# Everything here is pinned: actions by commit SHA (the `# vX.Y.Z` comment is
# what Dependabot reads to bump them), the runner image by name, uv and Python
# by exact version, service images by exact tag, and every program a step runs
# is declared in .github/pinned-tools.txt. scripts/check-ci-pins.py enforces
# that on every PR. Python packages come from the committed uv.lock, and it
# has to match pyproject.toml: `uv run --locked` here refuses to run on a
# stale lock (a bare `uv run` would quietly relock and resolve fresh), and
# the nox sessions install with `uv sync --locked` for the same reason.
# Canonical copy of the guard: Sylphie-Labs/hive-client.
#
# Pull requests run only the lint job (ruff check + format, no typecheck, no
# tests): a minute or so. Everything else — mypy, the unit and invariant
# suites, the numpy sizing tier, and the Docker-backed integration job —
# runs on pushes to `main`, i.e. once per merge. The trade: a PR that lints
# clean but fails a test lands on main and is caught there, loudly, after
# the merge; the fix is a follow-up PR. Mirrors hive-mind's lint-on-PR /
# full-gate-on-ship split (2026-09-10).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff check + format) — PRs and main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.13.15"
      # Guards this file, noxfile.py and .github/pinned-tools.txt: see the
      # header comment. Standard library only, so the image's python3 is fine.
      - name: CI pins are exact and every tool is declared
        run: python3 scripts/check-ci-pins.py
      - name: Lint
        run: uv run --locked nox -s lint

  check:
    name: typecheck · test · sizing (no Docker) — main pushes only
    # See the header: pull requests stop at `lint`.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.13.15"
      - name: Typecheck (mypy --strict)
        run: uv run --locked nox -s typecheck
      - name: Test (unit + invariant suites)
        run: uv run --locked nox -s test
      # The eval tier with numpy present. `test` and `typecheck` both run without it on purpose
      # (CANON S2, and pyproject's "must still type-check without the extra"), which leaves the
      # fast kernel skipped by pytest AND unchecked by mypy. This session covers both.
      - name: Typecheck + test (numpy present)
        run: uv run --locked nox -s sizing

  integration:
    name: integration + Spike Suite 1 (polyglot substrate)
    runs-on: ubuntu-24.04
    # The substrate job is heavier; keep it off every PR push until the
    # compose stack is wired. Enabled for main and release tags.
    if: github.ref == 'refs/heads/main'
    services:
      neo4j:
        image: neo4j:5.26.30
        env:
          NEO4J_AUTH: neo4j/cogworx-test
        ports: ["7687:7687"]
      postgres:
        image: timescale/timescaledb-ha:pg16.15-ts2.30.0
        env:
          POSTGRES_PASSWORD: cogworx-test
          POSTGRES_DB: cogworx
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.13.15"
      - name: Integration + spike
        env:
          COGWORX_NEO4J_URI: bolt://localhost:7687
          COGWORX_NEO4J_USER: neo4j
          COGWORX_NEO4J_PASSWORD: cogworx-test
          COGWORX_PG_DSN: postgresql://postgres:cogworx-test@localhost:5432/cogworx
        run: uv run --locked nox -s integration
