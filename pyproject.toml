[project]
name = "cog-worx"
version = "0.0.0"
description = "cog-worx — the cognitive-architecture framework: the loop, memory, verification, and perception, out of the box."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Jim Tisdale" }]
keywords = ["agents", "cognitive-architecture", "llm", "framework", "memory"]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    # Framework-side JSON-schema validation (S9 — never trust the model's self-report).
    "jsonschema>=4.23.0",
    # Polyglot substrate drivers (S3). Each engine for its strength.
    "neo4j>=5.27.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
# Model providers are adapters behind the S4 `Model` seam, never a hard dep.
# The walking skeleton and Spike Suite 1 run on the Test Kit's ReplayModel,
# so no provider SDK is required to build or test the framework itself.
providers = ["openai>=1.55.0", "anthropic>=0.40.0"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.42.1"]
# MCP tool integration (Pod 3.2d). The `mcp` SDK is import-guarded in
# cogworx.capability.mcp — core never imports it at module top level.
# StdioMCPClient is the only surface that requires it; FakeMCPClient
# and bind_mcp_tools work without it.
mcp = ["mcp>=1.3.0"]
# Sizing fast-kernel extra (Pod 4.4c-0). numpy powers the vectorized
# `cogworx.eval._sizing_fast` SAME-estimator bootstrap for the heavy sizing
# sweep ONLY. It is lazy-imported inside `sizing.run_sizing(kernel="fast")`
# and never touched by the core or the live gate, so `import cogworx.eval`
# works with numpy absent (CANON S2: numpy is the adopter's burden, opt-in).
# Additive optional extra -> pre-1.0 minor bump, no breaking change.
sizing = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "ruff>=0.15.16,<0.16",
    # Cap the major: an uncapped floor let `uv lock` drift mypy across a major (1.x -> 2.1.0),
    # lighting up ~155 pre-existing 2.x-only diagnostics. Pin to the validated 1.x baseline, the
    # same way ruff is capped above. Lift deliberately when migrating to mypy 2.x.
    "mypy>=1.13.0,<2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.130.0",
    "nox>=2024.10.9",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogworx"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# pgvector ships partial stubs; treat its helpers as untyped at the boundary.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# Provider SDKs are optional deps (the `providers` extra); a checkout without
# them installed must still type-check. The adapters lazy-import behind a guard.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

# MCP SDK is an optional dep (the `mcp` extra); lazy-imported inside methods only.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

# numpy is the optional `sizing` extra: top-level-imported only by the private
# `cogworx.eval._sizing_fast` fast kernel and lazy-imported by `sizing.py`. A
# checkout without the extra must still type-check (numpy ships its own stubs
# when installed; ignore when absent).
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: hits the real polyglot substrate (Neo4j + Postgres/Timescale/pgvector). Skipped by default when services are missing.",
    "spike: Spike Suite gate tests (S12). A sector does not harden until its spike passes.",
    "slow: long-running soak/chaos tests (e.g. the Pod 2.1 commit_xid soak). Opt in with -m slow.",
]
norecursedirs = [".*", "*.egg", "*.egg-info", "build", "dist"]
